<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bettersongdle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <aside class="sidebar sidebar-left">
      <h2 class="sidebar-title">Difficulty</h2>
      <div class="difficulty-list" id="difficultyList">
        <button class="difficulty-btn" data-tier="Easy">Easy</button>
        <button class="difficulty-btn" data-tier="Medium">Medium</button>
        <button class="difficulty-btn" data-tier="Hard">Hard</button>
        <button class="difficulty-btn" data-tier="Expert">Expert</button>
        <button class="difficulty-btn" data-tier="Impossible">Impossible</button>
      </div>
      <hr class="sidebar-divider">
      <button id="rerollBtn" class="reroll-link" type="button">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 9.5A8.5 8.5 0 0 1 18 6.4"/><path d="M18 2.5v4h-4"/><path d="M20.5 14.5A8.5 8.5 0 0 1 6 17.6"/><path d="M6 21.5v-4h4"/></svg>
        Reroll
      </button>
    </aside>

    <main class="game-card">
      <h1 class="logo">Bettersongdle</h1>

      <div class="era-row">
        <button class="era-arrow" disabled>‹</button>
        <span class="era-tab disabled" title="More eras coming soon">2020s</span>
        <span class="era-tab active">Any era (2010+)</span>
        <span class="era-tab disabled" title="More eras coming soon">Classic</span>
        <button class="era-arrow" disabled>›</button>
      </div>

      <div class="pill-row" id="pillRow">
        <button class="pill" data-tier="Easy">Easy</button>
        <button class="pill" data-tier="Medium">Medium</button>
        <button class="pill" data-tier="Hard">Hard</button>
        <button class="pill" data-tier="Expert">Expert</button>
        <button class="pill" data-tier="Impossible">Impossible</button>
      </div>

      <p id="datasetStatus" class="dataset-status"></p>

      <div class="snippet-wrap" id="snippetWrap">
        <div class="snippet-track" id="snippetTrack">
          <div class="snippet-fill" id="snippetFill"></div>
          <div class="snippet-ticks" id="snippetTicks"></div>
        </div>
        <div class="snippet-marker" id="snippetMarker">
          <span class="marker-arrow">▲</span>
          <span class="marker-label"><span id="markerLength">0.5</span>s</span>
        </div>
      </div>

      <div class="play-wrap" id="playWrap">
        <button id="playBtn" class="play-circle" aria-label="Play snippet">
          <svg class="icon-play" viewBox="0 0 24 24" width="48" height="48"><path d="M6 4l14 8-14 8V4z" fill="currentColor"/></svg>
          <svg class="icon-pause" viewBox="0 0 24 24" width="44" height="44"><rect x="5" y="4" width="5" height="16" rx="1.5" fill="currentColor"/><rect x="14" y="4" width="5" height="16" rx="1.5" fill="currentColor"/></svg>
        </button>
        <div class="play-duration"><span id="snippetLength">0.5</span>s</div>
      </div>

      <div class="guess-row">
        <div class="search-wrap">
          <svg class="search-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
          <input id="guessInput" type="text" placeholder="Name that track" autocomplete="off">
          <div id="suggestionsList" class="suggestions-list hidden"></div>
        </div>
        <button id="submitGuessBtn" class="submit-btn" type="button">Guess</button>
        <button id="skipBtn" class="skip-btn" type="button">
          Skip
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4l10 8-10 8V4z" fill="currentColor" stroke="none"/><path d="M19 5v14"/></svg>
        </button>
      </div>

      <div id="resultPanel" class="result-panel hidden">
        <a id="resultThumbLink" target="_blank" rel="noopener">
          <img id="resultThumb" class="result-thumb" alt="">
        </a>
        <p class="result-label">It was</p>
        <h2 id="resultTitle" class="result-title"></h2>
        <p id="resultSubtitle" class="result-subtitle"></p>
        <span id="resultPill" class="result-pill"></span>
        <div class="result-actions">
          <button id="playAgainBtn" class="next-btn">Next</button>
        </div>
      </div>
    </main>

    <aside class="sidebar sidebar-right">
      <h2 class="sidebar-title">Playback</h2>
      <p class="playback-note" title="Every snippet plays the true beginning of the track">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5.6c0-.8.9-1.3 1.6-.9l8.4 5.4c.6.4.6 1.4 0 1.8l-8.4 5.4c-.7.4-1.6-.1-1.6-.9V5.6z"/></svg>
        From the start
      </p>

      <h2 class="sidebar-title">Guess after</h2>
      <div class="duration-grid" id="durationGrid"></div>

      <h2 class="sidebar-title">Volume</h2>
      <input type="range" id="volumeSlider" min="0" max="100" value="70">
    </aside>

    <div id="ytPlayerContainer"><div id="ytPlayer"></div></div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="app.js"></script>
</body>
</html>
